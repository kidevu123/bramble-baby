# Bramble (new UI) on :80, Baby Buddy's original UI on :8000.
# Both share the same Django backend via uwsgi, so accounts, data and API keys are identical.

upstream babybuddy {
    server unix:///var/run/uwsgi/app/babybuddy/socket;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/bramble;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

    # Django-owned paths pass straight through to Baby Buddy.
    location ~ ^/(api|login|logout|admin|static|user|jsi18n)(/|$) {
        uwsgi_pass babybuddy;
        include uwsgi_params;
    }

    location /media/ {
        alias /opt/data/media/;
    }

    # Bramble companion service (contractions, activities, milestones, shared settings, push).
    location /bramble/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # a bridge print (60 s) or a People change (90 s) must not end in a 504 and a retry
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    location / {
        uwsgi_pass babybuddy;
        include uwsgi_params;
    }

    location /media/ {
        alias /opt/data/media/;
    }
}
